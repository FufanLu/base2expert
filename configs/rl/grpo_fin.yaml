# GRPO on finance (FinQA + TAT-QA arithmetic/count) from S-fin: the P6
# baseline that PPO, DAPO and GSPO are compared against at equal samples.
#   cluster/submit_rl.sh grpo_fin s_fin finance 3
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - base
  - _self_

data:
  val_max_samples: 512   # of FinQA dev + TAT-QA dev; the full sets are scored by b2e.eval.run_eval

trainer:
  experiment_name: grpo_fin
  total_training_steps: 150
