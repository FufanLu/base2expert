name: ci
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]  # run logs and notes; no code to test
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # reward: the instruction-following verifiers' deps (langdetect, nltk, ...); without them
      # tests/test_ifcheck.py cannot import the vendored IFEvalG checkers (F#39)
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev,reward]"
      - run: make check
